[package]
name = "usdr-server"
version.workspace = true
edition.workspace = true
description = "Single-radio SDR spectrum inspector and digital classifier for RTL-SDR"

[[bin]]
name = "usdr"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
clap.workspace = true
num-complex.workspace = true
scannerd-dsp.workspace = true
scannerd-engine.workspace = true
scannerd-radio.workspace = true
serde.workspace = true
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
toml.workspace = true
zeroize.workspace = true
