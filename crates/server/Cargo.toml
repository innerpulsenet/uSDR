[package]
name = "usdr-server"
version.workspace = true
edition.workspace = true
description = "Single-radio SDR spectrum inspector and digital classifier for RTL-SDR"

[[bin]]
name = "usdr"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
clap.workspace = true
num-complex.workspace = true
scannerd-dsp.workspace = true
scannerd-engine.workspace = true
scannerd-radio.workspace = true
serde.workspace = true
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time", "io-util"] }
toml.workspace = true
zeroize.workspace = true
# The wire format both sides share: the station, the decoders' settings and
# the fax rows are written here with the clients' own types.
usdr-proto = { path = "../proto" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
png = "0.18"
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
