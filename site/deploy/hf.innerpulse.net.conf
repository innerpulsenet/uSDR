# hf.innerpulse.net: the HF log. Static pages in /home/patrickh/www/hf, ingest on :8767.
# Who may read the pages is set in /etc/apache2/hf-access.conf, kept off the repo:
# until launch it names the addresses allowed to preview, and at launch it
# becomes "Require all granted".

<VirtualHost *:80>
    ServerName hf.innerpulse.net

    <IfModule mod_remoteip.c>
        RemoteIPHeader CF-Connecting-IP
        RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
        RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
    </IfModule>

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/hf_error.log
    CustomLog ${APACHE_LOG_DIR}/hf_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName hf.innerpulse.net
    DocumentRoot /home/patrickh/www/hf

    <IfModule mod_remoteip.c>
        RemoteIPHeader CF-Connecting-IP
        RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
        RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
    </IfModule>

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Require all granted
        Options -Indexes
    </Directory>

    <Directory /home/patrickh/www/hf>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        DirectoryIndex index.html
        Include /etc/apache2/hf-access.conf
    </Directory>

    # The receiver's uplink. The API refuses anything without its token.
    ProxyPass        /api/ingest http://127.0.0.1:8767/ingest connectiontimeout=3 timeout=40 retry=5
    ProxyPassReverse /api/ingest http://127.0.0.1:8767/ingest
    <Location /api/ingest>
        Require all granted
        LimitRequestBody 17825792
    </Location>

    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
    <FilesMatch "\.(js|css)$">
        Header set Cache-Control "public, max-age=300"
    </FilesMatch>
    <Directory /home/patrickh/www/hf/data>
        AddType application/json .json
        Header set Cache-Control "public, max-age=60"
    </Directory>
    <Directory /home/patrickh/www/hf/pictures>
        Header set Cache-Control "public, max-age=2592000, immutable"
    </Directory>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json text/css text/javascript application/javascript text/html
    </IfModule>

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/hf.innerpulse.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hf.innerpulse.net/privkey.pem
    SSLProtocol            -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder    off
    SSLSessionTickets      off

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'"

    ErrorLog  ${APACHE_LOG_DIR}/hf_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/hf_ssl_access.log combined
</VirtualHost>
</IfModule>
